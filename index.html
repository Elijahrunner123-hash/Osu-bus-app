    const result = await withDeadline(
      planTrip({ mode: state.mode, origin: state.location, entry: state.entry, permit: state.permit }),
      PLAN_DEADLINE_MS,
      "Routing took too long to respond."
    );
    if (!result) {
      content.innerHTML = `${topRowHtml(false)}
        <div class="sheet-title">No route found</div>
        <div class="sheet-sub">Nothing fit within the walk-time cap.</div>${chipsHtml()}${fileProtocolNoteHtml()}${settingsHtml()}`;
      wireSheetControls();
      return;
    }
    currentResult = result;
    renderSheet(result);
    drawRouteOnMap(result, state.location);
    await refreshBusLeg(result); // warms + patches the wait/distance the moment the sheet exists
    startArrivalTicker(result);
  } catch (err) {
    content.innerHTML = `${topRowHtml(false)}
      <div class="sheet-title">Couldn't find a route</div>
      <div class="sheet-sub">${err.message}</div>${chipsHtml()}${fileProtocolNoteHtml()}${settingsHtml()}`;
    wireSheetControls();
  }
}

// =========================================================================
// 7b. BROWSE VIEW — landing screen: every enabled route's shape + live buses
// =========================================================================

function routeCountText(code) {
  const cached = predictionCache.get(code);
  if (!cached) return "checking…";
  if (cached.status !== "ok") return "live data unavailable";
  const n = (cached.vehicles || []).length;
  return n === 0 ? "no buses running now" : `${n} bus${n === 1 ? "" : "es"}`;
}

function routeRowHtml(r) {
  const color = routeColor(r.code) || "#8e8e93";
  const checked = enabledRoutes.has(r.code);
  return `
    <label class="step" data-route-row="${r.code}">
      <input type="checkbox" data-route-toggle="${r.code}" ${checked ? "checked" : ""}
        style="width:22px;height:22px;flex:none;accent-color:${color};">
      <span style="width:12px;height:12px;border-radius:50%;background:${color};flex:none;" aria-hidden="true"></span>
      <div class="body">
        <div class="title">${r.code} · ${r.name} — <span data-route-count="${r.code}">${routeCountText(r.code)}</span></div>
      </div>
    </label>`;
}

function renderBrowseSheet() {
  document.getElementById("sheetContent").innerHTML = `
    <div class="sheet-title">Live Buses</div>
    <div class="sheet-sub">Toggle routes to show or hide them on the map.</div>

    <button type="button" class="btn-primary" data-generate-route>Generate route</button>

    <div class="steps">${routes.map(routeRowHtml).join("")}</div>

    ${isFileProtocol() ? `<div class="note">${fileProtocolNote()}</div>` : ""}
    ${mapUnavailable ? `<div class="note">${mapNote()}</div>` : ""}
    ${state.location.estimated ? `<div class="note">Using campus center — location wasn't available yet. Grant location access for a route from where you are.</div>` : ""}

    ${settingsHtml()}
  `;
  wireBrowseControls();
}

function wireBrowseControls() {
  document.querySelectorAll("[data-route-toggle]").forEach(cb =>
    cb.addEventListener("change", () => {
      const code = cb.dataset.routeToggle;
      if (cb.checked) enabledRoutes.add(code); else enabledRoutes.delete(code);
      saveEnabledRoutes(enabledRoutes);
      drawBrowseRoutes();
      drawBrowseVehicles();
    })
  );
  document.querySelector("[data-generate-route]")?.addEventListener("click", generateRoute);
  wireSettingsControls();
}

function patchRouteCounts() {
  document.querySelectorAll("[data-route-count]").forEach(el => {
    el.textContent = routeCountText(el.dataset.routeCount);
  });
}

// Paints immediately from whatever's already known (baked-in route shapes
// need no network at all; vehicles use whatever warmPredictions() last
// cached), then warms live predictions in the background and patches once
// they land — first paint is never gated on the network or on geolocation.
function renderBrowseView() {
  renderBrowseSheet();
  drawBrowseRoutes();
  drawBrowseVehicles();
  warmPredictions([...enabledRoutes]).then(() => {
    if (viewMode !== "browse") return; // navigated away while the fetch was in flight
    drawBrowseVehicles();
    patchRouteCounts();
  }).catch(err => console.error("warmPredictions (browse) failed:", err));
}

let browseTimer = null;
function stopBrowseTicker() {
  if (browseTimer) { clearInterval(browseTimer); browseTimer = null; }
}
function startBrowseTicker() {
  stopBrowseTicker();
  browseTimer = setInterval(async () => {
    if (document.hidden || viewMode !== "browse") return;
    await warmPredictions([...enabledRoutes]);
    if (viewMode !== "browse") return;
    drawBrowseVehicles();
    patchRouteCounts();
  }, PREDICTION_TTL_MS + 5000);
}

// Pressing "Generate route" hands the map and sheet over to the route view;
// clearing here (rather than relying on drawRouteOnMap()'s own
// clearMapLayers()) guarantees browse's polylines are gone even if planning
// then fails and only an error screen renders.
async function generateRoute() {
  viewMode = "route";
  stopBrowseTicker();
  clearMapLayers();
  clearVehicleMarkers();
  const ctx = currentTripContext(clockNow());
  state.mode = ctx.mode;
  state.today = ctx.today;
  state.entry = ctx.entry;
  await refresh();
}

function backToBrowse() {
  viewMode = "browse";
  stopArrivalTicker();
  currentResult = null;
  clearMapLayers();
  clearVehicleMarkers();
  renderBrowseView();
  startBrowseTicker();
}

// ---- Draggable sheet with peek / half / full snap points ----
let sheet, sheetHandle, recenterBtn;
let snaps = { full: 0, half: 0, peek: 0 };
let currentY = 0;

function computeSnaps() {
  const vh = window.innerHeight;
  const h = sheet.offsetHeight;
  snaps.full = 0;
  snaps.half = Math.max(0, Math.round(h - vh * 0.46));
  snaps.peek = Math.max(0, Math.round(h - 150));
}
function setSheetY(y, animate = true) {
  currentY = y;
  sheet.style.transition = animate ? "transform .38s cubic-bezier(.32,.72,0,1)" : "none";
  sheet.style.transform = `translateY(${y}px)`;
  const visible = sheet.offsetHeight - y;
  recenterBtn.style.bottom = `${visible + 14}px`;
}
function snapClosest() {
  const arr = [snaps.full, snaps.half, snaps.peek];
  const target = arr.reduce((p, c) => Math.abs(c - currentY) < Math.abs(p - currentY) ? c : p);
  setSheetY(target);
}

let dragging = false, startPointerY = 0, startY = 0;
function setupSheet() {
  sheet = document.getElementById("sheet");
  sheetHandle = document.getElementById("sheetHandle");
  recenterBtn = document.getElementById("recenter");

  sheetHandle.addEventListener("pointerdown", e => {
    dragging = true; startPointerY = e.clientY; startY = currentY;
    sheetHandle.setPointerCapture(e.pointerId);
    sheet.style.transition = "none";
  });
  sheetHandle.addEventListener("pointermove", e => {
    if (!dragging) return;
    let y = startY + (e.clientY - startPointerY);
    y = Math.max(snaps.full, Math.min(snaps.peek, y));
    setSheetY(y, false);
  });
  const endDrag = () => { if (dragging) { dragging = false; snapClosest(); } };
  sheetHandle.addEventListener("pointerup", endDrag);
  sheetHandle.addEventListener("pointercancel", endDrag);

  window.addEventListener("resize", () => {
    computeSnaps();
    setSheetY(Math.min(currentY, snaps.peek), false);
    if (map) map.invalidateSize();
  });

  recenterBtn.addEventListener("click", () => {
    if (map) map.setView([state.location.lat, state.location.lng], 16, { animate: true });
  });
}

// ---- Bootstrap ----
async function init() {
  // Same class of bug as the routing stall this replaces: init() runs before
  // anything is on screen but "Getting your location…", so any unexpected
  // throw in here (a missing global like Leaflet, a future regression) must
  // still land on an honest, usable sheet instead of leaving that up forever.
  try {
    state.permit = permits.find(p => p.code === "CXC");
    state.schedule = loadSchedule();
    enabledRoutes = loadEnabledRoutes();
    setupSheet();
    initMap();
    computeSnaps();
    setSheetY(snaps.half, false);

    const ctx = currentTripContext(clockNow());
    state.mode = ctx.mode;
    state.today = ctx.today;
    state.entry = ctx.entry;

    // The map must paint immediately at the campus default centre — first
    // paint is never gated on geolocation. Location resolves in the
    // background and only recentres the view / updates the "estimated"
    // note when (if) it arrives; denial still leaves a fully working browse
    // view, per the never-stall rule the rest of the app already follows.
    viewMode = "browse";
    renderBrowseView();
    startBrowseTicker();

    getUserLocation().then(loc => {
      state.location = loc;
      setUserMarker(loc);
      if (map) {
        map.setView([loc.lat, loc.lng], 15);
        map.invalidateSize();
      }
    }).catch(err => console.error("getUserLocation() failed:", err));
  } catch (err) {
    console.error("init() failed:", err);
    const content = document.getElementById("sheetContent");
    content.innerHTML = `<div class="sheet-title">Couldn't start</div>
      <div class="sheet-sub">${err.message}</div>${fileProtocolNoteHtml()}${settingsHtml()}`;
    wireSettingsControls();
  }
}

// Only auto-run in a browser; the Node vm smoke-test harness loads this file
// without a `document` and calls the pure functions directly.
if (typeof document !== "undefined" && document.getElementById("map")) {
  // init() already catches everything internally; this is defense in depth so
  // a future change to init() can never produce an unhandled rejection.
  init().catch(err => console.error("Unhandled init() failure:", err));
}
</script>
</body>
</html>
