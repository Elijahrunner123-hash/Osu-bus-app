<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CABS Parking Router</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<style>
  :root { color-scheme: light dark; }
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 0 auto; padding: 1rem; line-height: 1.4; }
  h1 { font-size: 1.25rem; }
  section { margin-bottom: 1.5rem; }
  .schedule-item { display: flex; justify-content: space-between; align-items: center; padding: .5rem 0; border-bottom: 1px solid #8884; }
  .schedule-item button { margin-left: .5rem; }
  .result { border: 1px solid #8884; border-radius: 6px; padding: .75rem; margin-top: .5rem; white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: .85rem; }
  .empty { opacity: .6; font-style: italic; }
  label { display: block; font-size: .85rem; margin-top: .5rem; }
  input[type=text] { width: 100%; box-sizing: border-box; padding: .4rem; margin-top: .2rem; }
  #map { height: 320px; border-radius: 6px; margin-top: .5rem; }
</style>
</head>
<body>
<h1>CABS Parking Router</h1>

<section id="settings">
  <details>
    <summary>Settings</summary>
    <label>OpenRouteService API key
      <input type="text" id="orsKeyInput" placeholder="paste your ORS API key">
    </label>
  </details>
</section>

<section id="schedule">
  <h2>Weekly Schedule</h2>
  <div id="scheduleList"></div>
</section>

<section id="output">
  <h2>Result</h2>
  <div id="resultBox" class="result empty">Pick a class above to route to/from it.</div>
  <div id="map"></div>
</section>

<script>
// =========================================================================
// 1. DATA — permits, lots, stops, buildings, schedule
// =========================================================================

const permits = [
  { code: "CXC", name: "Buckeye Lot (Student)", lots: ["carmack", "buckeye"] },
  // TODO: transcribe other permit types (CXS, C, CG, CE, WC, WCE, WCO, D, WD, CXD, ...)
  // from osu.campusparc.com as they become relevant.
];

const lots = [
  { id: "carmack", name: "Carmack Lot", lat: 40.00102, lng: -83.03715 }, // Carmack 2 bus stop, used as the lot point
  { id: "buckeye", name: "Buckeye Lot", lat: 40.01600, lng: -83.03066 }, // Buckeye Lot bus stop, used as the lot point
];

const stops = [
  // Just enough stops to route Buckeye/Carmack <-> Campbell/Jennings Hall.
  // TODO: transcribe the rest of the ~46 CABS stops from ttm.osu.edu/cabs-bus-stop-list as more classes are added.
  { id: "buckeye-lot-sb", name: "Buckeye Lot (southbound)", lat: 40.01600, lng: -83.03066, routes: ["BE", "CLS"] },
  { id: "carmack-2-sb", name: "Carmack 2 (southbound)", lat: 40.00102, lng: -83.03715, routes: ["MC"] },
  { id: "arps-hall-nb", name: "Arps Hall (northbound)", lat: 40.0019522, lng: -83.0096785, routes: ["BE", "CC", "CLS", "ER", "NWC"] },
];

const buildings = [
  { id: "campbell-hall", name: "Campbell Hall", lat: 39.9977868, lng: -83.0158255 },
  { id: "jennings-hall", name: "Jennings Hall", lat: 39.9967622, lng: -83.0154345 },
];

const schedule = [
  { day: "Mon", start: "10:20", end: "11:15", building: "campbell-hall" }, // Biology 1113 lecture
  { day: "Wed", start: "10:20", end: "11:15", building: "campbell-hall" }, // Biology 1113 lecture
  { day: "Fri", start: "10:20", end: "11:15", building: "campbell-hall" }, // Biology 1113 lecture
  { day: "Tue", start: "08:00", end: "10:45", building: "jennings-hall" }, // Biology 1113 lab
];

// =========================================================================
// 2. WALKING — walkTime(a, b) via OpenRouteService
// =========================================================================

function getOrsApiKey() {
  return localStorage.getItem("orsApiKey") || "";
}

// Set by walkTime() whenever it had to fall back to a straight-line estimate
// (no ORS key yet), so the UI can flag results as approximate.
let usedWalkEstimateFallback = false;

// Straight-line prefilter so we don't hit the ORS API for obviously-too-far stops.
function haversineKm(a, b) {
  const R = 6371;
  const dLat = (b.lat - a.lat) * Math.PI / 180;
  const dLng = (b.lng - a.lng) * Math.PI / 180;
  const lat1 = a.lat * Math.PI / 180, lat2 = b.lat * Math.PI / 180;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLng / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(h), Math.sqrt(1 - h));
}

function estimateWalkMinutes(distanceKm) {
  const walkKmh = 5;
  return (distanceKm / walkKmh) * 60;
}

// Walking leg between two {lat, lng} points, via OpenRouteService: duration in
// minutes plus the path geometry (as [lat, lng] points, for drawing on the map).
// Falls back to a straight-line estimate when no API key is set yet, so routing
// still produces output — swap in the key (Settings) for accurate times/paths.
// LATER: swap internals for self-hosted OSRM if ORS's free tier becomes limiting.
async function walkRoute(a, b) {
  const apiKey = getOrsApiKey();
  if (!apiKey) {
    usedWalkEstimateFallback = true;
    return {
      minutes: estimateWalkMinutes(haversineKm(a, b)),
      geometry: [[a.lat, a.lng], [b.lat, b.lng]],
      estimated: true,
    };
  }

  const url = new URL("https://api.openrouteservice.org/v2/directions/foot-walking");
  url.searchParams.set("api_key", apiKey);
  url.searchParams.set("start", `${a.lng},${a.lat}`);
  url.searchParams.set("end", `${b.lng},${b.lat}`);

  const res = await fetch(url);
  if (!res.ok) throw new Error(`ORS request failed: ${res.status}`);
  const data = await res.json();
  const feature = data.features[0];
  return {
    minutes: feature.properties.summary.duration / 60,
    geometry: feature.geometry.coordinates.map(([lng, lat]) => [lat, lng]),
    estimated: false,
  };
}

// Convenience wrapper for callers that only need the duration.
async function walkTime(a, b) {
  return (await walkRoute(a, b)).minutes;
}

// =========================================================================
// 3. REALTIME — getNextArrival(stopId, routeId)
// =========================================================================

// STUB: returns a plausible fake value.
// LATER: replace internals with the real CABS live-bus fetch call found via
// proxying the official "Ohio State" app (see cabs-router-plan.md §2).
async function getNextArrival(stopId, routeId) {
  return 2 + Math.random() * 10;
}

// =========================================================================
// 4. ROUTING — bestRoute(...)
// =========================================================================

function stopsOnRoute(routeId) {
  return stops.filter(s => s.routes.includes(routeId));
}

// Stops within maxWalkMinutes of `origin` ({lat,lng}), using a haversine
// prefilter before spending ORS calls on real walk times.
async function stopsNear(origin, maxWalkMinutes) {
  const candidates = stops.filter(
    s => estimateWalkMinutes(haversineKm(origin, s)) <= maxWalkMinutes * 1.3
  );
  const withWalkTimes = await Promise.all(
    candidates.map(async s => {
      const leg = await walkRoute(origin, s);
      return { stop: s, walk: leg.minutes, walkGeometry: leg.geometry, walkEstimated: leg.estimated };
    })
  );
  return withWalkTimes.filter(x => x.walk <= maxWalkMinutes);
}

// Rough static estimate until real-time position data can calibrate it.
function scheduledRideTime(stop, dropStop, route) {
  const avgBusKmh = 15;
  const km = haversineKm(stop, dropStop);
  return (km / avgBusKmh) * 60;
}

async function bestRoute(fromCar, targetBuilding, permit) {
  const candidateLots = permit.lots.map(id => lots.find(l => l.id === id)).filter(Boolean);
  let best = null;

  for (const lot of candidateLots) {
    const origin = fromCar ? lot : targetBuilding;
    const destination = fromCar ? targetBuilding : lot;

    const nearOrigin = await stopsNear(origin, 15);
    for (const { stop, walk: walk1, walkGeometry: walk1Geometry, walkEstimated: walk1Estimated } of nearOrigin) {
      for (const route of stop.routes) {
        const wait = await getNextArrival(stop.id, route);
        const dropCandidates = stopsOnRoute(route).filter(s => s.id !== stop.id);
        for (const dropStop of dropCandidates) {
          const walk2Leg = await walkRoute(dropStop, destination);
          if (walk2Leg.minutes > 15) continue;
          const rideTime = scheduledRideTime(stop, dropStop, route);
          const total = walk1 + wait + rideTime + walk2Leg.minutes;
          if (!best || total < best.total) {
            best = {
              lot, stop, route, dropStop, walk1, wait, rideTime, total,
              walk1Geometry, walk1Estimated,
              walk2: walk2Leg.minutes, walk2Geometry: walk2Leg.geometry, walk2Estimated: walk2Leg.estimated,
            };
          }
        }
      }
    }
  }

  return best;
}

// =========================================================================
// 5. MAP — Leaflet + OpenStreetMap tiles (no Apple/Google account needed)
// =========================================================================

let map = null;
let mapLayers = [];

function initMap() {
  if (map) return;
  map = L.map("map").setView([40.0067, -83.0305], 15); // OSU campus
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
    maxZoom: 19,
  }).addTo(map);
}

function clearMapLayers() {
  mapLayers.forEach(layer => map.removeLayer(layer));
  mapLayers = [];
}

// Draws the winning route from bestRoute() on the map: markers for each leg's
// endpoints, real walking paths where available (dashed when estimated), and
// a straight dashed line for the bus leg (CABS route shapes aren't sourced yet).
function drawRouteOnMap(result, fromCar, building) {
  initMap();
  clearMapLayers();

  const origin = fromCar ? result.lot : building;
  const destination = fromCar ? building : result.lot;

  const addMarker = (point, label) => {
    mapLayers.push(L.marker([point.lat, point.lng]).addTo(map).bindPopup(label));
  };
  addMarker(origin, origin === result.lot ? result.lot.name : building.name);
  addMarker(result.stop, `Board here: ${result.stop.name} (route ${result.route})`);
  addMarker(result.dropStop, `Get off here: ${result.dropStop.name}`);
  addMarker(destination, destination === result.lot ? result.lot.name : building.name);

  mapLayers.push(L.polyline(result.walk1Geometry, {
    color: "#2a7", weight: 4, dashArray: result.walk1Estimated ? "6 6" : null,
  }).addTo(map));

  mapLayers.push(L.polyline(
    [[result.stop.lat, result.stop.lng], [result.dropStop.lat, result.dropStop.lng]],
    { color: "#c33", weight: 4, dashArray: "2 8" }
  ).addTo(map).bindPopup("Bus leg — straight line shown; the real CABS route path isn't loaded yet"));

  mapLayers.push(L.polyline(result.walk2Geometry, {
    color: "#2a7", weight: 4, dashArray: result.walk2Estimated ? "6 6" : null,
  }).addTo(map));

  const allPoints = [
    ...result.walk1Geometry,
    [result.stop.lat, result.stop.lng],
    [result.dropStop.lat, result.dropStop.lng],
    ...result.walk2Geometry,
  ];
  map.fitBounds(allPoints, { padding: [30, 30] });
}

// =========================================================================
// 6. UI
// =========================================================================

const orsKeyInput = document.getElementById("orsKeyInput");
orsKeyInput.value = getOrsApiKey();
orsKeyInput.addEventListener("change", () => {
  localStorage.setItem("orsApiKey", orsKeyInput.value.trim());
});

function renderSchedule() {
  const list = document.getElementById("scheduleList");
  list.innerHTML = "";

  if (schedule.length === 0) {
    list.innerHTML = '<p class="empty">No classes added yet — fill in the `schedule` array in index.html.</p>';
    return;
  }

  for (const entry of schedule) {
    const row = document.createElement("div");
    row.className = "schedule-item";
    row.innerHTML = `
      <span>${entry.day} ${entry.start}–${entry.end} @ ${entry.building}</span>
      <span>
        <button data-mode="toClass">To class</button>
        <button data-mode="toCar">To car</button>
      </span>
    `;
    row.querySelector('[data-mode="toClass"]').addEventListener("click", () => runRoute(entry, true));
    row.querySelector('[data-mode="toCar"]').addEventListener("click", () => runRoute(entry, false));
    list.appendChild(row);
  }
}

async function runRoute(entry, fromCar) {
  const resultBox = document.getElementById("resultBox");
  resultBox.classList.remove("empty");
  resultBox.textContent = "Calculating...";

  const building = buildings.find(b => b.id === entry.building);
  const permit = permits.find(p => p.code === "CXC");

  if (!building) {
    resultBox.textContent = `Building "${entry.building}" isn't in the \`buildings\` array yet.`;
    return;
  }
  if (stops.length === 0) {
    resultBox.textContent = "No CABS stops configured yet — fill in the `stops` array in index.html.";
    return;
  }

  try {
    usedWalkEstimateFallback = false;
    const result = await bestRoute(fromCar, building, permit);
    if (!result) {
      resultBox.textContent = "No route found within the walk-time cap.";
      return;
    }
    const note = usedWalkEstimateFallback
      ? "(no ORS API key set — walk times are straight-line estimates, not real walking directions)\n\n"
      : "";
    resultBox.textContent =
      note +
      `${fromCar ? "Car → " + entry.building : entry.building + " → Car"}\n` +
      `Park at: ${result.lot.name}\n` +
      `Walk to stop: ${result.stop.name} (${result.walk1.toFixed(1)} min)\n` +
      `Route: ${result.route} (wait ~${result.wait.toFixed(1)} min)\n` +
      `Ride to: ${result.dropStop.name} (~${result.rideTime.toFixed(1)} min)\n` +
      `Walk to destination: ${result.walk2.toFixed(1)} min\n` +
      `Total: ~${result.total.toFixed(1)} min`;
    drawRouteOnMap(result, fromCar, building);
  } catch (err) {
    resultBox.textContent = `Error: ${err.message}`;
  }
}

renderSchedule();
</script>
</body>
</html>
